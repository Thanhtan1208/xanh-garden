# CI: kiểm định dạng code, chạy test backend, build frontend mỗi lần push hoặc mở PR
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# Push mới lên cùng nhánh thì hủy lượt chạy cũ
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Cùng múi giờ với cửa hàng để test ngày giờ cho kết quả như trên máy
    TZ: Asia/Ho_Chi_Minh

jobs:
    format:
        name: Định dạng code (Prettier)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm run format:check

    backend:
        name: Test backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            # Bộ test tự tạo dữ liệu tạm, không gửi mail thật, không gọi OpenAI nên không cần secret
            - run: npm test

    postgres:
        name: Test backend trên PostgreSQL
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: ci-only
                    POSTGRES_DB: xanhgarden
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            # Cả bộ test chạy với dữ liệu lưu trong PostgreSQL (mỗi file test một schema riêng)
            - run: npm test
              env:
                  TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/xanhgarden

    production:
        name: Build và chạy thử production
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      frontend/package-lock.json
                      backend/package-lock.json
            # Đúng lệnh dùng khi deploy: cài, build frontend, cài backend không kèm gói dev
            - run: npm run build
            # Khóa chỉ dùng cho lượt chạy thử này, không phải khóa thật
            - name: Chạy server production, gọi thử trang và API
              env:
                  NODE_ENV: production
                  AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
                  SEPAY_API_KEY: ci-only-sepay-key
                  ADMIN_PASSWORD: Ci#Garden2026x
              run: |
                  npm start > server.log 2>&1 &
                  for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health > /dev/null && break; sleep 1; done
                  curl -fsS http://localhost:3000/api/health
                  curl -fsS http://localhost:3000/ | grep -qi '<!doctype html'
                  curl -fsS http://localhost:3000/products | grep -qi '<!doctype html'
                  curl -fsS http://localhost:3000/api/products | grep -q '"id"'
            - name: Log server khi lỗi
              if: failure()
              run: cat server.log
