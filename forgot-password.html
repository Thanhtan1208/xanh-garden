<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quên mật khẩu - Xanh Garden</title>
        <link rel="icon" href="./src/static/IMAGES/favicon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=optional">
        <link rel="stylesheet" href="./src/static/CSS/main.css">
    </head>
    <body>
        <header class="header" id="siteHeader"><div class="container header-placeholder"><a href="./index.html" class="logo">Xanh Garden</a></div></header>
        <main class="container page">
            <div class="auth-wrap">
                <div class="auth-aside"><img src="./src/static/IMAGES/bg/bg7.jpg" alt=""><div><b>Lấy lại mật khẩu</b><ul><li>Nhập email đã đăng ký để nhận mã</li><li>Mã có hiệu lực 10 phút</li><li>Mật khẩu mới cần đủ mạnh để bảo vệ tài khoản</li></ul></div></div>
                <form id="forgotForm" class="auth-form" novalidate>
                <h1>Quên mật khẩu</h1>
                <label>Email đã đăng ký
                    <input type="email" name="email" autocomplete="email" maxlength="80" required>
                </label>
                <button type="submit" class="btn btn-block btn-lg">Gửi mã xác nhận</button>
                <p id="message1" class="error-message" role="alert"></p>
                <p><a href="./login.html">Quay lại đăng nhập</a></p>
            </form>
            <form id="resetForm" class="auth-form hidden" novalidate>
                <h1>Đặt lại mật khẩu</h1>
                <p id="intro" class="muted"></p>
                <label>Mã xác nhận (6 chữ số)
                    <input type="text" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="code-input" required>
                </label>
                <label>Mật khẩu mới
                    <input type="password" name="password" autocomplete="new-password" maxlength="64" required>
                    <ul id="pwRules" class="pw-rules"></ul>
                </label>
                <label>Nhập lại mật khẩu mới
                    <input type="password" name="confirmPassword" autocomplete="new-password" required>
                </label>
                <button type="submit" class="btn btn-block btn-lg">Đổi mật khẩu</button>
                <p id="message2" class="error-message" role="alert"></p>
            </form>
            </div>
        </main>
        <script type="module" src="./src/js/pages/forgot-password-page.js"></script>
    </body>
</html>
