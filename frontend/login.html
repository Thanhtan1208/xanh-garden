<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập - Xanh Garden</title>
        <link rel="icon" href="./src/static/IMAGES/favicon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=optional">
        <link rel="stylesheet" href="./src/static/CSS/main.css">
    </head>
    <body>
        <header class="header" id="siteHeader"><div class="container header-placeholder"><a href="./index.html" class="logo">Xanh Garden</a></div></header>
        <main class="container page">
            <div class="auth-wrap">
                <div class="auth-aside"><img src="./src/static/IMAGES/bg/bg4.jpg" alt=""><div><b>Chào mừng bạn quay lại</b><ul><li>Theo dõi trạng thái đơn hàng</li><li>Giỏ hàng lưu theo tài khoản, đổi máy vẫn còn</li><li>Lưu sản phẩm yêu thích, nhận voucher sinh nhật</li></ul></div></div>
                <form id="loginForm" class="auth-form">
                <h1>Đăng nhập</h1>
                <label>Tên đăng nhập hoặc email
                    <input type="text" name="username" autocomplete="username" required autofocus>
                </label>
                <label>Mật khẩu
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn-block btn-lg">Đăng nhập</button>
                <p id="message" class="error-message" role="alert"></p>
                <p><a href="./forgot-password.html">Quên mật khẩu?</a></p>
                <p>Chưa có tài khoản? <a href="./dangky.html">Đăng ký</a></p>
            </form>
            </div>
        </main>
        <script type="module" src="./src/js/pages/login-page.js"></script>
    </body>
</html>
