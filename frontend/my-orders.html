<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đơn hàng của tôi - Xanh Garden</title>
        <link rel="icon" href="./src/static/IMAGES/favicon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=optional">
        <link rel="stylesheet" href="./src/static/CSS/main.css">
    </head>
    <body>
        <header class="header" id="siteHeader"><div class="container header-placeholder"><a href="./index.html" class="logo">Xanh Garden</a></div></header>
        <main class="container page">
            <h1>Đơn hàng của tôi</h1>
            <div id="statusTabs" class="tabs"></div>
            <input type="search" id="orderSearch" class="wide-input" placeholder="Tìm theo mã đơn hoặc tên sản phẩm" aria-label="Tìm đơn hàng">
            <p id="actionMessage" class="msg" role="status"></p>
            <div id="loading" class="loading">Đang tải đơn hàng...</div>
            <div id="error" class="error hidden"></div>
            <div id="orderList"></div>
        </main>
        <!-- jsPDF + AutoTable để xuất hóa đơn PDF -->
        <script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.3/dist/jspdf.umd.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.2/dist/jspdf.plugin.autotable.min.js" defer></script>
        <script type="module" src="./src/js/pages/my-orders-page.js"></script>
    </body>
</html>
